[package]
name = "rustfilt"
description = "Demangle Rust symbol names"
repository = "https://github.com/rust-lang/rustc-demangle"
version = "0.2.2"
authors = ["Ted Mielczarek <ted@mielczarek.org>", "Nicholas Schlabach <Techcable@techcable.ent>"]
readme = "README.md"
license = "Apache-2.0"
edition = "2024"

[dependencies]
rustc-demangle = { version = "0.1.28", features = ["std"] }

[dependencies.clap]
version = "^4.6.7"
# Exclude all optional features except wrap_help
default-features = false
features = ["wrap_help"]
